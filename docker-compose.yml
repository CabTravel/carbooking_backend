
services:
  api:
    build: .
    container_name: carbooking_api
    restart: unless-stopped
    
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
        
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      
    expose:
      - "8000"




  db:
    image: postgres:16

    container_name: carbooking_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      

  redis:
    image: redis:7
    container_name: carbooking_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    expose:
      - "6379"

  nginx:
    image: nginx:alpine
    container_name: carbooking_nginx
    restart: unless-stopped
    depends_on:
      - api

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  
volumes:
  postgres_data:
  redis_data:






